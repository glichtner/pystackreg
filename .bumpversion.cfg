[bumpversion]
current_version = 0.3.0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.(?P<release>[a-z]+)(?P<dev>\d+))?
serialize = 
	{major}.{minor}.{patch}.{release}{dev}
	{major}.{minor}.{patch}
commit = True
tag = False

[bumpversion:part:release]
optional_value = final
first_value = dev
values = 
	dev
	final

[bumpversion:file:pystackreg/version.py]
