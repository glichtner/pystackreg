name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tools
        run: python -m pip install ruff mypy codespell numpy
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: codespell
        run: codespell

  test:
    name: Test py${{ matrix.python-version }} numpy${{ matrix.numpy }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        numpy: ["latest"]
        include:
          # oldest supported NumPy for the oldest supported Python
          - os: ubuntu-latest
            python-version: "3.10"
            numpy: "1.22.4"
          - os: windows-latest
            python-version: "3.10"
            numpy: "1.22.4"
          # last NumPy 1.x release
          - os: ubuntu-latest
            python-version: "3.12"
            numpy: "1.26.4"
          - os: macos-latest
            python-version: "3.12"
            numpy: "1.26.4"
          # Intel macOS
          - os: macos-15-intel
            python-version: "3.12"
            numpy: "latest"
          # free-threaded CPython
          - os: ubuntu-latest
            python-version: "3.14t"
            numpy: "latest"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      # The wheel is installed into the environment and the tests are run
      # from an empty directory, so that the installed build is tested and
      # not the source tree. conftest.py enforces this.
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl pytest tifffile

      - name: Pin NumPy ${{ matrix.numpy }}
        if: matrix.numpy != 'latest'
        run: python -m pip install "numpy==${{ matrix.numpy }}"

      # SciPy is only used by an optional cross-check of the interpolation;
      # it is skipped where no binary wheel of SciPy is available.
      - name: Install SciPy if a wheel exists
        shell: bash
        run: |
          python -m pip install --only-binary ":all:" scipy || echo "SciPy not available"

      - name: Run tests
        shell: bash
        env:
          PYSTACKREG_TEST_INSTALLED: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          python -m pytest "$GITHUB_WORKSPACE/tests" -p no:cacheprovider \
            --rootdir "$GITHUB_WORKSPACE" -c "$GITHUB_WORKSPACE/pyproject.toml"

  exact:
    name: Bit-exact comparison with 0.2.8 (Linux x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pytest tifffile
      - name: Regression tests, exact mode
        env:
          PYSTACKREG_EXACT_BASELINE: "1"
          PYSTACKREG_TEST_INSTALLED: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_regression.py" \
            -p no:cacheprovider \
            --rootdir "$GITHUB_WORKSPACE" -c "$GITHUB_WORKSPACE/pyproject.toml"

  sanitizers:
    name: AddressSanitizer and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build instrumented extension and run the tests
        run: |
          python -m pip install numpy setuptools pytest tifffile scipy tqdm
          tools/sanitize.sh

  sdist:
    name: Source distribution and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Check contents
        run: python tools/check_dist.py dist
      - name: Install from sdist and test
        env:
          PYSTACKREG_TEST_INSTALLED: "1"
        run: |
          python -m pip install dist/*.tar.gz pytest tifffile scipy
          mkdir -p "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          python -m pytest "$GITHUB_WORKSPACE/tests" -p no:cacheprovider \
            --rootdir "$GITHUB_WORKSPACE" -c "$GITHUB_WORKSPACE/pyproject.toml"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ".[docs]"
      - name: Build (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
