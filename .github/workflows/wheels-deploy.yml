name: Build and deploy wheels

# Builds wheels for all supported platforms with cibuildwheel and tests each
# of them. Nothing is uploaded unless a version tag (v*) is pushed: a manual
# run only produces workflow artifacts. The upload uses PyPI trusted
# publishing; see docs/release.rst for the one-time setup on PyPI.

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm builds the aarch64 wheels natively
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  check:
    name: Check distributions
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Metadata and contents
        run: |
          python -m pip install twine
          ls -l dist
          python -m twine check --strict dist/*
          python tools/check_dist.py dist

  upload_pypi:
    name: Upload to PyPI
    needs: [check]
    runs-on: ubuntu-latest
    # only for pushed version tags, never for manual runs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/pystackreg/
    permissions:
      # short-lived OpenID Connect token for PyPI trusted publishing; no API
      # token is stored in the repository
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
